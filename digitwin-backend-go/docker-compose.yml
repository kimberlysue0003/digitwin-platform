version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitwin-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: digitwin123
      POSTGRES_DB: digitwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: digitwin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: digitwin-backend-go
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:digitwin123@postgres:5432/digitwin?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: 3000
      ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
