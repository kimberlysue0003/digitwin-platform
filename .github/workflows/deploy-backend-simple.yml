name: Deploy Backend to EC2 (Simple)

on:
  push:
    branches: [ main ]
    paths:
      - 'digitwin-backend-go/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binary
        run: |
          cd digitwin-backend-go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server ./cmd/server/main.go
          tar czf deploy.tar.gz server static/

      - name: Package buildings artifact (optional)
        run: |
          if [ -d digitwin-frontend/public/buildings ]; then
            echo "Found frontend public/buildings; packaging for import..."
            tar czf digitwin-backend-go/buildings.tar.gz -C digitwin-frontend/public buildings
          elif [ -d digitwin-frontend/dist/buildings ]; then
            echo "Found frontend dist/buildings; packaging for import..."
            tar czf digitwin-backend-go/buildings.tar.gz -C digitwin-frontend/dist buildings
          else
            echo "No buildings directory found; skipping buildings artifact."
          fi

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "digitwin-backend-go/deploy.tar.gz"
          target: "/home/ubuntu/"

      - name: Upload buildings artifact to EC2 (optional)
        if: hashFiles('digitwin-backend-go/buildings.tar.gz') != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "digitwin-backend-go/buildings.tar.gz"
          target: "/home/ubuntu/"

      - name: Run on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=========================================="
            echo "Starting deployment..."
            echo "=========================================="

            cd ~
            mkdir -p digitwin-backend-go
            tar xzf digitwin-backend-go/deploy.tar.gz -C digitwin-backend-go/
            cd digitwin-backend-go

            # Stop and remove old containers
            echo "Cleaning up old containers..."
            docker stop digitwin-backend-go digitwin-redis || true
            docker rm digitwin-backend-go digitwin-redis || true

            # Create network if not exists
            docker network create digitwin-net || true

            # Start Redis
            echo "Starting Redis..."
            docker run -d \
              --name digitwin-redis \
              --network digitwin-net \
              --restart unless-stopped \
              redis:7-alpine

            # Seed map_textures from static JSONs using Go container
            echo "Seeding map textures into RDS..."
            docker run --rm \
              --network digitwin-net \
              -v ~/digitwin-backend-go:/app \
              -w /app \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_SSLMODE=require \
              golang:1.23 \
              /usr/local/go/bin/go run scripts/import/map-textures.go || true

            # Import real buildings if artifact exists
            if [ -f ~/digitwin-backend-go/buildings.tar.gz ]; then
              echo "Extracting and importing real buildings..."
              mkdir -p buildings
              tar xzf ~/digitwin-backend-go/buildings.tar.gz -C buildings/
              docker run --rm \
                --network digitwin-net \
                -v ~/digitwin-backend-go:/app \
                -v ~/digitwin-backend-go/buildings:/data \
                -w /app \
                -e DB_HOST=${{ secrets.DB_HOST }} \
                -e DB_PORT=${{ secrets.DB_PORT }} \
                -e DB_USER=${{ secrets.DB_USER }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                -e DB_NAME=${{ secrets.DB_NAME }} \
                -e DB_SSLMODE=require \
                golang:1.23 \
                /usr/local/go/bin/go run scripts/import/import_real_buildings.go /data/buildings || true
            else
              echo "No buildings artifact provided; skipping buildings import."
            fi

            # Run new container with precompiled binary
            echo "Starting new container..."
            docker run -d \
              --name digitwin-backend-go \
              --network digitwin-net \
              -p 3000:3000 \
              -v ~/digitwin-backend-go/server:/app/server \
              -v ~/digitwin-backend-go/static:/app/static \
              -w /app \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_SSLMODE=require \
              -e REDIS_HOST=digitwin-redis \
              -e REDIS_PORT=6379 \
              -e SERVER_PORT=3000 \
              -e TZ=Asia/Singapore \
              --restart unless-stopped \
              alpine:latest \
              /app/server

            # Wait for health check
            echo "Waiting for backend to be healthy..."
            sleep 5
            for i in {1..30}; do
              if curl -f http://localhost:3000/health > /dev/null 2>&1; then
                echo "✓ Backend is healthy!"
                curl http://localhost:3000/health
                exit 0
              fi
              echo "Attempt $i/30: Backend not ready yet..."
              sleep 2
            done

            echo "✗ Backend failed to become healthy"
            docker logs digitwin-backend-go --tail 50
            exit 1

      - name: Deployment Summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend URL**: http://18.142.236.220:3000" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: http://18.142.236.220:3000/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
